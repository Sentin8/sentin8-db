[package]
name = "sentin8-db-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Rust HTTP client for Sentin8:DB (structured persistence)."

[lib]
name = "sentin8_db_client"
path = "src/lib.rs"

[dependencies]
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
sentin8-middleware.workspace = true
sentin8-db-contracts = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
sentin8-tls = { workspace = true }

[features]
default = []